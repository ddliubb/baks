name: Backup Vulnerability-Wiki-PoC (simple)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror public repo into subdir
        run: |
          rm -rf mirror/Vulnerability-Wiki-PoC
          mkdir -p mirror
          git clone --depth=1 https://github.com/SourByte05/Vulnerability-Wiki-PoC.git mirror/Vulnerability-Wiki-PoC

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mirror/Vulnerability-Wiki-PoC
          git commit -m "chore: daily backup" || exit 0
          git push
